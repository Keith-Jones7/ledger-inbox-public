[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ledger-inbox"
version = "0.2.0"
description = "A multi-tenant, channel-agnostic image inbox for extensible bookkeeping automation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Keith Jones" }]
keywords = ["bookkeeping", "automation", "ocr", "email", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
  "Pillow>=11,<13",
  "pillow-heif>=0.22,<2",
  "iso4217>=1.12,<2",
]

[project.urls]
Repository = "https://github.com/Keith-Jones7/ledger-inbox-public"
Issues = "https://github.com/Keith-Jones7/ledger-inbox-public/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
ledger-inbox = "ledger_inbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_inbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ledger_inbox/api.py" = ["B008"]
