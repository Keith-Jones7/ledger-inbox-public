name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests scripts examples
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run pytest
      - run: uv run python scripts/smoke.py
      - run: uv build

  container-smoke:
    runs-on: ubuntu-latest
    env:
      LEDGER_INBOX_EMAIL_WEBHOOK_SECRET: synthetic-ci-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: docker compose cp scripts/smoke.py api:/tmp/smoke.py
      - run: docker compose exec -T api python /tmp/smoke.py --url http://127.0.0.1:8080
      - run: docker compose restart
      - run: docker compose up --wait
      - run: docker compose cp scripts/smoke.py api:/tmp/smoke.py
      - run: docker compose exec -T api python /tmp/smoke.py --url http://127.0.0.1:8080
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
